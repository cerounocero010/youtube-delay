<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Please wait...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    #countdown {
      font-size: 80px;
      font-weight: bold;
    }

    p {
      font-size: 18px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>YouTube will open in</h1>

    <div id="countdown">20</div>

    <p>Please wait...</p>
  </div>

  <script>
    let seconds = 20;

    const countdown = document.getElementById("countdown");

    // Get the YouTube URL from ?url=
    const params = new URLSearchParams(window.location.search);
    const destination = params.get("url");

    // Only allow YouTube links
    let youtubeURL = "https://www.youtube.com/";

    if (destination) {
      try {
        const parsed = new URL(destination);

        if (
          parsed.hostname === "youtube.com" ||
          parsed.hostname === "www.youtube.com" ||
          parsed.hostname === "youtu.be" ||
          parsed.hostname === "www.youtu.be"
        ) {
          youtubeURL = parsed.href;
        }
      } catch (error) {
        console.log("Invalid URL");
      }
    }

    const timer = setInterval(function() {

      seconds--;

      countdown.textContent = seconds;

      if (seconds <= 0) {

        clearInterval(timer);

        // Navigate the actual browser tab
        window.location.replace(youtubeURL);
      }

    }, 1000);
  </script>

</body>
</html>
